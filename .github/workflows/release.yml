name: Build & Release Standalone Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite Production Frontend
        run: pnpm build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r requirements.txt
          pip install pyinstaller

      - name: Package Standalone App with PyInstaller
        run: |
          python build_desktop.py

      - name: Compress Executable into ZIP
        run: |
          Compress-Archive -Path release\Quatern\* -DestinationPath release\Quatern-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quatern-Windows-x64
          path: release/Quatern-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Quatern-Windows-x64.zip
          name: Quatern ${{ github.ref_name }}
          body: |
            ## Quatern Standalone Desktop App
            
            This release contains the standalone Windows desktop application.
            
            ### Quick Start (No Python or Node required):
            1. Download `Quatern-Windows-x64.zip` below.
            2. Extract the ZIP folder.
            3. Run `Quatern.exe`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
